<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>volatility</title>
    <link rel="stylesheet" href="correlation.css">
</head>
<body>
    <h1>Réseau de corrélation </h1>
    <p>Jouez avec le seuil pour faire apparaître / disparaître des liens !</p>

    <div class="slider-container">
        <label for="correlation-slider">Seuil de corrélation (|ρ| ≥ seuil)</label>
        <input type="range" id="correlation-slider" min="0" max="1" step="0.01" value="0.20">
        <div class="slider-labels">
            <span class="min-label">0.00</span>
            <span class="max-label">1.00</span>
        </div>
        <span id="slider-value">0.20</span>
    </div>

    <script src="app.js" defer></script>
</body>
</html>
