<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>InvestTrack - Portfolio Backtester</title>
  </head>
  <body>
    <!-- 
      This is the root element where the React application 
      (from src/main.jsx) will be mounted. 
    -->
    <div id="root"></div>

    <!-- 
      This script tag tells the browser to load the main JavaScript entry file.
      The path must be relative to the root of the serving directory (which is /app).
    -->
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
