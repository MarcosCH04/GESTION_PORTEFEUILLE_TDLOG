version: "3.9"

services:
  backend:
    build: ./backend
    container_name: backend
    volumes:
      - ./backend/app:/app/app
      - ./backend/data:/app/data
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    container_name: frontend
    volumes:
      - ./frontend/src:/app/src
    ports:
      - "3000:3000"
